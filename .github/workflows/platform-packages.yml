name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: corepack enable
      - name: Verify release tag matches the source version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node distribution/scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: mvn --batch-mode versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload tested runtime tarball
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: distribution/target/npm-tarballs/termestra-runtime-${{ matrix.platform }}-${{ matrix.arch }}-*.tgz
          if-no-files-found: error
      - name: Upload tested CLI tarball
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: npm-cli
          path: distribution/target/npm-tarballs/termestra-cli-*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist/runtimes
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: npm-cli
          path: dist/npm-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1 && npm --version
      - name: Select publish authentication
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            echo "TERMESTRA_NPM_PUBLISH_MODE=bootstrap-token" >> "$GITHUB_ENV"
            echo "Using the temporary bootstrap token for the initial package release."
          else
            echo "TERMESTRA_NPM_PUBLISH_MODE=trusted-publishing" >> "$GITHUB_ENV"
            echo "Using npm Trusted Publishing."
          fi
      - name: Select npm release channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            echo "TERMESTRA_NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "TERMESTRA_NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
      - name: Publish platform runtimes first
        shell: bash
        env:
          TERMESTRA_NPM_REGISTRY: https://registry.npmjs.org
          TERMESTRA_NPM_ACCEPTED_EXISTING_INTEGRITIES: >-
            {"@termestra/runtime-darwin-arm64@0.1.0":"sha512-myO26mkPLxVQK9p+P27LxgFXAzN+UrEyweBnse1W+blBzOItf+HpJnakxBqSIM3QfOfsSPwl8EoW8zMpKtwBhw=="}
        run: |
          shopt -s nullglob
          packages=(dist/runtimes/*.tgz)
          test "${#packages[@]}" -eq 5
          node distribution/scripts/publish-npm-tarballs.mjs "$TERMESTRA_NPM_DIST_TAG" "${packages[@]}"
      - name: Publish CLI after all runtimes
        shell: bash
        env:
          TERMESTRA_NPM_REGISTRY: https://registry.npmjs.org
        run: |
          shopt -s nullglob
          packages=(dist/npm-cli/*.tgz)
          test "${#packages[@]}" -eq 1
          node distribution/scripts/publish-npm-tarballs.mjs "$TERMESTRA_NPM_DIST_TAG" "${packages[@]}"
